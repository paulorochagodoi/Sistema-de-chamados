global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    stack: itsm

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # métricas de negócio expostas pelo itsm-bridge (SLA em risco, filas, etc.)
  - job_name: itsm-bridge
    metrics_path: /metrics
    static_configs:
      - targets: ["itsm-bridge:8000"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
