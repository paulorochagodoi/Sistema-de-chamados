# Roteamento externo. Ajuste o host para o seu domínio e o issuer do cert-manager.
# O portal é a porta de entrada: publique-o no domínio raiz e/ou em portal.<domínio>.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itsm
  namespace: itsm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - portal.example.com
        - glpi.example.com
        - bridge.example.com
      secretName: itsm-tls
  rules:
    - host: portal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  name: http
    - host: glpi.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glpi
                port:
                  name: http
    - host: bridge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: itsm-bridge
                port:
                  name: http
