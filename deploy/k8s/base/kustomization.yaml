apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Os componentes com estado (MariaDB, PostgreSQL, Redis, MinIO, Keycloak,
# Prometheus/Grafana/Loki) vêm de Helm charts oficiais — ver ../helm/ e
# ../README.md. Aqui ficam apenas as cargas próprias do sistema.
resources:
  - namespace.yaml
  - glpi.yaml
  - itsm-bridge.yaml
  - ingress.yaml
  - networkpolicy.yaml
  # secrets.example.yaml é referência: gere os segredos reais fora do Git.

commonLabels:
  app.kubernetes.io/part-of: itsm
