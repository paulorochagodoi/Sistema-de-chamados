# portal — painel unificado (SPA + proxy para o itsm-bridge). Stateless e
# somente leitura em disco: escala horizontal sem cuidado especial.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: itsm
  labels:
    app.kubernetes.io/name: portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101            # usuário nginx da imagem alpine
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: portal
          image: ghcr.io/OWNER/itsm-portal:1.0.0   # publique sua imagem e ajuste aqui
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            # nginx escreve cache e pid: com rootfs somente leitura, em memória
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: conf
          configMap:
            name: portal-nginx
---
# A porta 8080 (e não 80) permite rodar o nginx sem privilégios; o upstream
# aponta para o Service do bridge no cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-nginx
  namespace: itsm
data:
  default.conf: |
    # Só as rotas que o painel usa; os webhooks ficam no host do bridge.
    map $uri $rota_do_painel {
        default          0;
        ~^/api/portal/   1;
        ~^/api/sla/      1;
        ~^/api/billing/  1;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            if ($rota_do_painel = 0) {
                return 404;
            }

            proxy_pass http://itsm-bridge.itsm.svc.cluster.local:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: itsm
spec:
  selector:
    app.kubernetes.io/name: portal
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portal
  namespace: itsm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
