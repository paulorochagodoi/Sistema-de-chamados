# EXEMPLO — não aplique como está e não versione segredos reais.
# Em produção use External Secrets Operator, Sealed Secrets ou SOPS.
#
#   kubectl create secret generic glpi-db -n itsm \
#     --from-literal=username=glpi --from-literal=password="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: glpi-db
  namespace: itsm
type: Opaque
stringData:
  username: glpi
  password: TROQUE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: itsm-bridge
  namespace: itsm
type: Opaque
stringData:
  glpi-app-token: TROQUE-ME
  glpi-user-token: TROQUE-ME
  rmm-webhook-secret: TROQUE-ME
  chatwoot-webhook-secret: TROQUE-ME
  redis-url: redis://:TROQUE-ME@redis-master.itsm-data.svc.cluster.local:6379/1
