[project]
name = "itsm-bridge"
version = "1.0.0"
description = "Integrações do sistema ITSM containerizado (RMM, omnichannel, SLA, faturamento)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() no default de parâmetro é o idioma do FastAPI
