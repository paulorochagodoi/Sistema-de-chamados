# O portal serve o bundle e é o único host com que o navegador conversa: /api
# vai para o itsm-bridge por dentro da rede do Compose. Isso mantém tudo na
# mesma origem (sem CORS) e deixa a API do painel atrás do mesmo controle de
# acesso do portal.

# Só as rotas que o painel usa. Os webhooks do bridge (assinados por HMAC) são
# publicados em bridge.<DOMAIN> e não precisam de um segundo caminho aqui.
map $uri $rota_do_painel {
    default          0;
    ~^/api/portal/   1;
    ~^/api/sla/      1;
    ~^/api/billing/  1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # o TLS termina no Traefik; aqui só registramos o IP real
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;

    # DNS embutido do Docker: resolvido em tempo de execução, para o portal
    # subir mesmo que o bridge ainda não esteja de pé e para acompanhar a troca
    # de IP quando o bridge é recriado.
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # o bundle tem hash no nome: pode ser cacheado agressivamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        if ($rota_do_painel = 0) {
            return 404;
        }

        set $bridge http://itsm-bridge:8000;
        proxy_pass $bridge$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
